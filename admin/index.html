<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hudson Bay — App URL 管理</title>
<style>
  :root { --bg: #0b1f3a; --card: #122c52; --line: rgba(255,255,255,.08); --muted: #93a1b5; --accent: #d8b45e; --ok: #3dd39a; --err: #ff7a7e; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #fff; font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .box { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; }
  h1 { font-size: 18px; margin-bottom: 4px; }
  .sub { font-size: 12px; color: var(--muted); margin-bottom: 20px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 6px; }
  input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: #fff; font-size: 14px; outline: none; }
  input:focus { border-color: var(--accent); }
  button { width: 100%; margin-top: 18px; padding: 13px; border: none; border-radius: 10px; background: var(--accent); color: #0b1d38; font-size: 15px; font-weight: 700; cursor: pointer; }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .6; cursor: default; }
  .msg { margin-top: 14px; font-size: 13px; min-height: 18px; }
  .msg.ok { color: var(--ok); }
  .msg.err { color: var(--err); }
  .cur { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); word-break: break-all; }
  .cur b { color: #fff; font-size: 13px; display: block; margin-top: 4px; }
</style>
</head>
<body>
  <div class="box">
    <h1>App URL 管理</h1>
    <div class="sub">修改 App 内加载的网址（app.web_url 配置）</div>

    <label>管理密码</label>
    <input type="password" id="pw" placeholder="输入管理密码" autocomplete="current-password">
    <label>当前网址</label>
    <input type="text" id="url" placeholder="https://…">
    <button id="btn" type="button">保存</button>
    <div class="msg" id="msg"></div>
    <div class="cur">当前生效的网址（App 启动时读取）：<b id="cur">加载中…</b></div>
  </div>

<script>
const API = 'https://www.hbcnexpro.com/api/v1';
const KEY = 'app.web_url';
const $ = (id) => document.getElementById(id);

// 不能用 storage 抛异常（无痕模式等）拖垮整个页面
const store = {
  get: (k) => { try { return sessionStorage.getItem(k) || ''; } catch { return ''; } },
  set: (k, v) => { try { sessionStorage.setItem(k, v); } catch {} },
  del: (k) => { try { sessionStorage.removeItem(k); } catch {} },
};

// token 每次从输入框现取，不能用页面加载时读到的旧值
async function api(path, token, opts = {}) {
  return fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'x-admin-token': token, ...opts.headers },
  });
}

async function loadCurrent() {
  try {
    const r = await fetch(API + '/config/public', { cache: 'no-store' });
    const j = await r.json();
    const cur = j.data && j.data.configs && j.data.configs[KEY];
    $('cur').textContent = cur || '（尚未设置）';
    if (cur && !$('url').value) $('url').value = cur;
  } catch { $('cur').textContent = '（读取失败）'; }
}

function show(kind, text) {
  const msg = $('msg');
  msg.className = 'msg ' + kind;
  msg.textContent = text;
}

function isHttpUrl(s) {
  try { const u = new URL(s); return (u.protocol === 'https:' || u.protocol === 'http:') && !!u.hostname; } catch { return false; }
}

let saving = false;
async function act() {
  if (saving) return;
  const pass = $('pw').value;
  const url = $('url').value.trim();
  show('', '');
  if (!pass) return show('err', '请输入密码');
  if (!isHttpUrl(url)) return show('err', '请输入完整网址（以 http/https 开头）');
  saving = true;
  $('btn').disabled = true;
  try {
    const r = await api('/admin/app-config', pass, { method: 'POST', body: JSON.stringify({ key: KEY, value: url }) });
    if (r.status === 401 || r.status === 403) { store.del('adminPw'); return show('err', '密码错误'); }
    if (!r.ok) {
      const j = await r.json().catch(() => null);
      throw new Error((j && j.message) || 'HTTP ' + r.status);
    }
    store.set('adminPw', pass);
    show('ok', '已保存，用户下次打开 App 即生效');
    await loadCurrent();
  } catch (e) {
    show('err', '保存失败：' + e.message);
  } finally {
    saving = false;
    $('btn').disabled = false;
  }
}

// 注意：on* 事件属性的处理器返回 false 等同于 preventDefault()。
// 旧写法 (e) => e.key === 'Enter' && act() 对除回车外的每个键都返回 false，
// 于是所有按键的默认行为（输入字符）都被取消了。这里用 addEventListener（忽略返回值）。
function onEnter(e) {
  if (e.key === 'Enter' && !e.isComposing) act();
}
$('pw').addEventListener('keydown', onEnter);
$('url').addEventListener('keydown', onEnter);
$('btn').addEventListener('click', act);
$('pw').value = store.get('adminPw');
loadCurrent();
</script>
</body>
</html>
